spring.application.name=medical-insurance
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_insurance}
spring.datasource.username=${DB_USER:insurance}
spring.datasource.password=${DB_PASSWORD:insurance_dev}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
