services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: medical_insurance
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: insurance_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurance -d medical_insurance"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
